name: Sync Upstream

on:
  schedule:
    # 北京时间每天 02:17、08:17、14:17、20:17（GitHub 可能延迟执行）
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'sunjian028/cfnew'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from byJoey/cfnew
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub 官方同步接口：保留本仓库提交，冲突或权限错误时失败，不强制覆盖。
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -H "Accept: application/vnd.github+json" \
            -f branch=main | tee "$RUNNER_TEMP/upstream-sync.json"
          {
            echo "## Upstream sync"
            echo "Source: byJoey/cfnew → sunjian028/cfnew (main)"
            jq -r '.message' "$RUNNER_TEMP/upstream-sync.json"
          } >> "$GITHUB_STEP_SUMMARY"
